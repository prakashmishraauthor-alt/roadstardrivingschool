<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Roadstar Driving School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #dce4e8;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .checkout-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        h2 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; }
        .details-box {
            background: #f4f6f8;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 0.9rem;
        }
        .pay-btn {
            width: 100%;
            padding: 14px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
        }
        .upi-icons {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 0.05em;
        }
    </style>

    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <div class="checkout-card">
        <h2>Complete Payment</h2>
        <div class="details-box">
            <p><strong>Order ID:</strong> <span id="bookingId">Loading...</span></p>
            <p><strong>Package:</strong> <span id="packageName">Loading...</span></p>
        </div>

        <button class="pay-btn" id="payNowBtn">Pay via UPI / GPay / Paytm</button>

        <div class="upi-icons">
            Supports Google Pay, PhonePe, Paytm & BHIM UPI
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('bookingId');
        const packageName = urlParams.get('package');

        document.getElementById('bookingId').textContent = bookingId || 'N/A';
        document.getElementById('packageName').textContent = packageName || 'Standard Package';

        document.getElementById('payNowBtn').onclick = function(e) {
            // Initialize Razorpay Standard Checkout
            const options = {
                "key": "YOUR_RAZORPAY_KEY_ID", // Replace with Key ID from Razorpay Dashboard
                "amount": "29900", // Amount in paise (e.g. 29900 = ₹299)
                "currency": "INR",
                "name": "Roadstar Driving School",
                "description": packageName,
                "handler": function (response){
                    alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                    // Optionally update Firebase status to 'Paid' here
                    window.location.href = "index.html";
                },
                "prefill": {
                    "method": "upi" // Defaults user to UPI apps (GPay, PhonePe, Paytm)
                },
                "theme": {
                    "color": "#111111"
                }
            };
            const rzp = new Razorpay(options);
            rzp.open();
            e.preventDefault();
        }
    </script>
</body>
</html>
